# Périmètre d'écriture autorisé, par étape. Une ligne : <numéro>|<motifs>
#
# @PAQ@  → le paquet Python (ADAM/adam5000 avant renommage, serie/dcon après)
# @BASE@ → son dossier parent (ADAM, puis serie)
#
# Ce fichier est lu par chantier/gardes.sh (constat après coup) ET par
# .claude/hooks/perimetre-garde.py (refus avant l'écriture). Une seule source.
#
# Tout écart n'est pas une faute de l'agent : c'est le signal que le plan et le
# code ont divergé. L'agent doit alors s'arrêter avec ETAT=PLAN_FAUX.
#
# chantier/etat.env, chantier/traces/*, chantier/JOURNAL.md et TODO.md sont
# autorisés partout : ce sont les seules sorties que tout agent doit pouvoir
# écrire. TODO.md est bridé séparément (cases et tableau seulement).
#
# docs/* figure à chaque étape parce que chantier/boucle.sh invoque le
# sous-agent `documenter` APRÈS CHAQUE étape, sans exception. L'omettre revient
# à bloquer la boucle en « hors périmètre » dès que la documentation touchée
# par l'étape doit être reprise.

1|@BASE@/tests/*
2|@BASE@/* ADAM/* serie/* .gitignore docs/* CLAUDE.md lancer-adam.sh lancer-diagnostic.sh chantier/* .claude/*
3|@PAQ@/*.py @PAQ@/familles/* @BASE@/tests/* docs/*
4|@PAQ@/*.py @PAQ@/familles/* @PAQ@/modules/* @BASE@/tests/* docs/*
5|@PAQ@/monitor.py @PAQ@/modules/* @BASE@/tests/* docs/*
6|@PAQ@/cli.py @PAQ@/cli/* @PAQ@/__init__.py @BASE@/tests/* @BASE@/README.md @BASE@/lancer_adam.sh CLAUDE.md docs/*
7|@PAQ@/settings.py @PAQ@/cli/* @PAQ@/monitor.py @BASE@/config.json @BASE@/tests/* docs/*
8|@PAQ@/diagnostic.py @PAQ@/cli/* @BASE@/tests/* docs/*
9|@PAQ@/*.py @PAQ@/modules/* @PAQ@/cli/* @PAQ@/familles/* @BASE@/tests/* docs/*
10|@BASE@/*.sh lancer-adam.sh lancer-diagnostic.sh @PAQ@/cli/* docs/*
11|docs/* @BASE@/tests/*
